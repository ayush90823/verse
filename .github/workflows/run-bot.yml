name: Telegram Bot Runner

on:
  workflow_dispatch:  # Manual Run button ke liye
  schedule:
    - cron: '0 */5 * * *'  # Har 5 ghante me auto-trigger

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max limit to keep workflow active

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto requests firebase-admin

      - name: Start Telegram Bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bot.py
